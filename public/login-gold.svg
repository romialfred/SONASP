<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Or brut et balance de précision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dc"/>
      <stop offset="0.35" stop-color="#e6d7b7"/>
      <stop offset="0.7" stop-color="#d9bd82"/>
      <stop offset="1" stop-color="#c9a659"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#f6e2ad" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#e7c980" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a659" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nug" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#e6bf62"/>
      <stop offset="1" stop-color="#a9822f"/>
    </radialGradient>
    <radialGradient id="nugDark" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e7c877"/>
      <stop offset="0.55" stop-color="#bd9038"/>
      <stop offset="1" stop-color="#7d5c1e"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="1400" fill="url(#bg)"/>
  <rect width="900" height="1400" fill="url(#glow)"/>

  <!-- Balance de précision : fléau, tiges, plateau -->
  <g stroke="#b79a5f" stroke-opacity="0.5" fill="none" stroke-width="3">
    <line x1="150" y1="120" x2="760" y2="150"/>
    <line x1="300" y1="130" x2="330" y2="470"/>
    <line x1="640" y1="140" x2="600" y2="470"/>
    <ellipse cx="330" cy="500" rx="150" ry="34" stroke-opacity="0.4"/>
    <ellipse cx="610" cy="500" rx="150" ry="34" stroke-opacity="0.4"/>
    <line x1="452" y1="105" x2="452" y2="40"/>
  </g>

  <!-- Amas de pépites d'or -->
  <g filter="url(#soft)">
    <ellipse cx="520" cy="900" rx="230" ry="150" fill="#caa458" opacity="0.55"/>
  </g>
  <g>
    <circle cx="430" cy="820" r="70" fill="url(#nug)"/>
    <circle cx="540" cy="800" r="90" fill="url(#nugDark)"/>
    <circle cx="620" cy="880" r="64" fill="url(#nug)"/>
    <circle cx="470" cy="920" r="86" fill="url(#nug)"/>
    <circle cx="585" cy="960" r="72" fill="url(#nugDark)"/>
    <circle cx="360" cy="905" r="56" fill="url(#nugDark)"/>
    <circle cx="675" cy="965" r="48" fill="url(#nug)"/>
    <circle cx="500" cy="1030" r="60" fill="url(#nug)"/>
    <circle cx="400" cy="1000" r="46" fill="url(#nugDark)"/>
    <circle cx="640" cy="1050" r="40" fill="url(#nugDark)"/>
    <!-- éclats -->
    <circle cx="410" cy="800" r="10" fill="#fff3cf" opacity="0.8"/>
    <circle cx="560" cy="785" r="8" fill="#fff3cf" opacity="0.7"/>
    <circle cx="470" cy="905" r="9" fill="#fff3cf" opacity="0.7"/>
  </g>

  <rect width="900" height="1400" fill="#8a6a25" opacity="0.05"/>
</svg>
