<!doctype html>
<html lang="fr-BF">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006533" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #f8f6ef; }
      .sonasp-bootstrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Manrope, Arial, sans-serif;
        color: #12352b;
        background:
          radial-gradient(circle at 50% 42%, rgba(9, 126, 78, .08), transparent 28%),
          #f8f6ef;
      }
      .sonasp-bootstrap__inner { display: grid; justify-items: center; gap: 18px; }
      .sonasp-bootstrap img { width: 178px; height: auto; }
      .sonasp-bootstrap__ring {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(0, 101, 51, .16);
        border-top-color: #006533;
        border-right-color: #d4a318;
        border-radius: 50%;
        animation: sonasp-bootstrap-spin .8s linear infinite;
      }
      .sonasp-bootstrap span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      @keyframes sonasp-bootstrap-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sonasp-bootstrap__ring { animation: none; } }
    </style>
    <title>Plateforme nationale de collecte et de vente de l’or | SONASP</title>
    <meta
      name="description"
      content="La plateforme sécurisée de la SONASP dédiée à la collecte, aux achats, aux ventes et au suivi des opérations aurifères au Burkina Faso."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_BF" />
    <meta property="og:site_name" content="SONASP" />
    <meta property="og:title" content="Plateforme nationale de collecte et de vente de l’or | SONASP" />
    <meta
      property="og:description"
      content="La plateforme sécurisée de la SONASP dédiée à la collecte, aux achats, aux ventes et au suivi des opérations aurifères au Burkina Faso."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plateforme nationale de collecte et de vente de l’or | SONASP" />
    <meta
      name="twitter:description"
      content="La plateforme sécurisée de la SONASP dédiée à la collecte, aux achats, aux ventes et au suivi des opérations aurifères au Burkina Faso."
    />
    <!--
      `canonical`, `og:url` et les images sociales seront ajoutés uniquement
      lorsque l'URL publique officielle et un visuel de partage validé auront été fournis.
    -->
    <!-- SONASP_PUBLIC_URL_METADATA -->
  </head>
  <body>
    <div id="root">
      <div class="sonasp-bootstrap" role="status" aria-label="Chargement de la plateforme SONASP">
        <div class="sonasp-bootstrap__inner">
          <img src="/SONASP v2.png" alt="SONASP" width="621" height="211" />
          <i class="sonasp-bootstrap__ring" aria-hidden="true"></i>
          <span>Ouverture de la plateforme</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
