<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Gold background -->
  <rect width="512" height="512" fill="#B8860B"/>

  <!-- Slate Blue accent border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#475569" stroke-width="12"/>

  <!-- Gold bar icon - centered -->
  <g transform="translate(256, 256)">
    <!-- Main gold bar -->
    <rect x="-120" y="-60" width="240" height="120" fill="#FFD700" stroke="#475569" stroke-width="6" rx="12"/>

    <!-- Shine effect on top left -->
    <rect x="-100" y="-45" width="80" height="30" fill="#FFFFFF" opacity="0.4" rx="6"/>

    <!-- Inner detail lines -->
    <line x1="-120" y1="-20" x2="120" y2="-20" stroke="#475569" stroke-width="2" opacity="0.3"/>
    <line x1="-120" y1="20" x2="120" y2="20" stroke="#475569" stroke-width="2" opacity="0.3"/>

    <!-- Corner accents -->
    <circle cx="-90" cy="-30" r="8" fill="#475569" opacity="0.5"/>
    <circle cx="90" cy="-30" r="8" fill="#475569" opacity="0.5"/>
    <circle cx="-90" cy="30" r="8" fill="#475569" opacity="0.5"/>
    <circle cx="90" cy="30" r="8" fill="#475569" opacity="0.5"/>
  </g>

  <!-- Decorative corner elements -->
  <circle cx="50" cy="50" r="15" fill="#10B981" opacity="0.6"/>
  <circle cx="462" cy="50" r="15" fill="#10B981" opacity="0.6"/>
  <circle cx="50" cy="462" r="15" fill="#10B981" opacity="0.6"/>
  <circle cx="462" cy="462" r="15" fill="#10B981" opacity="0.6"/>
</svg>
