name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - SONASP_2026
  workflow_dispatch:

permissions:
  contents: read

env:
  # Valeurs non sensibles utilisées uniquement pour initialiser le client
  # Supabase pendant les contrôles statiques et les tests. Aucun appel métier
  # distant ne doit dépendre de ces valeurs.
  VITE_SUPABASE_URL: https://sonasp-ci.invalid
  VITE_SUPABASE_ANON_KEY: sonasp-ci-anon-key

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint and TypeScript contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit
      - run: node scripts/check-migration-integrity.mjs verify
      - run: npm run lint
      - run: npm run typecheck

  tests:
    name: Deterministic test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit
      - run: npx vitest run --maxWorkers=4

  production-build:
    name: Production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit
      - name: Audit des dépendances de production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high \
              --fetch-retries=1 \
              --fetch-retry-mintimeout=5000 \
              --fetch-retry-maxtimeout=15000 \
              --fetch-timeout=60000; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::L'audit de sécurité npm a échoué après trois tentatives."
              exit 1
            fi

            sleep $((attempt * 10))
          done
      - run: npm run build:release
