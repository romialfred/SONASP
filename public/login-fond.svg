<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Or brut dans une batée">
  <!--
    Fond du panneau de connexion — ATTENTE D'UNE PHOTOGRAPHIE.

    La maquette montre un cliché d'orpaillage : une main gantée et une batée
    d'or brut. Le projet n'en contient aucun, et je n'en invente pas un.

    Ce dessin tient la place : mêmes valeurs, même composition — sombre à
    gauche sous le texte, or à droite — pour que la mise en page soit jugée
    telle qu'elle sera. Dès qu'une vraie photographie est déposée dans
    `public/`, il suffit de la nommer dans la variable login-photo de
    src/pages/Login.css, et ce fichier n'est plus chargé.

    (Pas de double tiret dans ce texte : XML l'interdit en commentaire, et le
    fichier devient alors indécodable — sans la moindre erreur visible.)
  -->
  <defs>
    <radialGradient id="sol" cx="0.62" cy="0.58" r="0.86">
      <stop offset="0" stop-color="#3a2f18"/>
      <stop offset="0.45" stop-color="#22200f"/>
      <stop offset="1" stop-color="#0d1409"/>
    </radialGradient>

    <linearGradient id="batee" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4a3d20"/>
      <stop offset="0.5" stop-color="#2e2713"/>
      <stop offset="1" stop-color="#171408"/>
    </linearGradient>

    <radialGradient id="creux" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#5a4620"/>
      <stop offset="0.7" stop-color="#2a2210"/>
      <stop offset="1" stop-color="#191407"/>
    </radialGradient>

    <radialGradient id="pepite" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#ffe9a4"/>
      <stop offset="0.42" stop-color="#f2c249"/>
      <stop offset="1" stop-color="#ab7d18"/>
    </radialGradient>

    <radialGradient id="pepiteOmbre" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#e6bc50"/>
      <stop offset="0.5" stop-color="#b98c22"/>
      <stop offset="1" stop-color="#5d430f"/>
    </radialGradient>

    <radialGradient id="lueur" cx="0.6" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd67a" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#c58f2a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.72" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <filter id="flou" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="flouDoux" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1000" height="900" fill="url(#sol)"/>

  <!-- La batee et son or sont poussés vers la droite : à leur place d'origine
       ils tombaient sous le titre, que le voile devait alors couvrir au point
       d'effacer l'image. Décalés, ils occupent le tiers droit du panneau, là
       où la maquette les montre. -->
  <g transform="translate(168,-10)">
  <ellipse cx="620" cy="470" rx="430" ry="330" fill="url(#lueur)"/>

  <!-- La batée, vue de trois quarts. -->
  <ellipse cx="600" cy="500" rx="392" ry="300" fill="url(#batee)"/>
  <ellipse cx="600" cy="512" rx="352" ry="266" fill="url(#creux)"/>
  <ellipse cx="600" cy="500" rx="392" ry="300" fill="none" stroke="#6d5a2c" stroke-opacity="0.42" stroke-width="7"/>
  <ellipse cx="600" cy="486" rx="392" ry="300" fill="none" stroke="#c9a24f" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Masse d'or : une base floue, puis les pièces qui se détachent. -->
  <g filter="url(#flou)">
    <ellipse cx="618" cy="530" rx="286" ry="196" fill="#b98f34" opacity="0.62"/>
  </g>

  <g filter="url(#flouDoux)" opacity="0.85">
    <circle cx="430" cy="470" r="52" fill="url(#pepiteOmbre)"/>
    <circle cx="820" cy="452" r="46" fill="url(#pepiteOmbre)"/>
    <circle cx="762" cy="632" r="50" fill="url(#pepiteOmbre)"/>
  </g>

  <g>
    <circle cx="500" cy="452" r="58" fill="url(#pepiteOmbre)"/>
    <circle cx="612" cy="424" r="72" fill="url(#pepite)"/>
    <circle cx="722" cy="470" r="54" fill="url(#pepiteOmbre)"/>
    <circle cx="540" cy="540" r="76" fill="url(#pepite)"/>
    <circle cx="668" cy="556" r="64" fill="url(#pepiteOmbre)"/>
    <circle cx="452" cy="576" r="48" fill="url(#pepite)"/>
    <circle cx="792" cy="556" r="42" fill="url(#pepite)"/>
    <circle cx="588" cy="646" r="56" fill="url(#pepite)"/>
    <circle cx="700" cy="672" r="40" fill="url(#pepiteOmbre)"/>
    <circle cx="492" cy="662" r="38" fill="url(#pepiteOmbre)"/>
    <circle cx="636" cy="500" r="34" fill="url(#pepite)"/>
    <circle cx="852" cy="596" r="30" fill="url(#pepiteOmbre)"/>
    <circle cx="392" cy="516" r="30" fill="url(#pepite)"/>
  </g>

  <!-- Éclats spéculaires : ce sont eux qui font lire le métal. -->
  <g fill="#fff6d8">
    <circle cx="590" cy="398" r="11" opacity="0.82"/>
    <circle cx="518" cy="512" r="9" opacity="0.7"/>
    <circle cx="480" cy="432" r="7" opacity="0.6"/>
    <circle cx="566" cy="622" r="8" opacity="0.62"/>
    <circle cx="778" cy="540" r="6" opacity="0.55"/>
    <circle cx="648" cy="534" r="5" opacity="0.5"/>
  </g>

  </g>

  <!-- Ombre portée depuis le haut gauche : la main du cliché de référence. -->
  <g filter="url(#flou)" opacity="0.9">
    <path d="M0 0 L470 0 Q380 150 250 250 Q120 340 0 360 Z" fill="#050d06"/>
  </g>

  <rect width="1000" height="900" fill="url(#vignette)"/>
</svg>
